# Sprinkler Plus — example Lovelace card
#
# size: 100 | 75 | 50
# durations are minutes, in the same order as zones.
# A zone object can override the name, minutes, and remaining sensor.

type: custom:sprinkler-plus-card
name: Sprinklers
size: 100
default_duration: 15
durations: "15, 10, 20, 12"
zones:
  - switch.front_lawn
  - switch.side_yard
  - switch.west_lawn
  - switch.back_beds
rain_delay_entity: switch.sprinkler_rain_delay
show_actions: true

